name: Deploy

on:
    workflow_dispatch:
    push:
        branches:
            - main
            - master

permissions:
    contents: read
    id-token: write

env:
    CF_SEND_TELEMETRY: "false"

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        name: Deploy
        steps:
            - uses: actions/checkout@v4

            - uses: voidzero-dev/setup-vp@v1.22.0
              with:
                  node-version-file: .node-version
                  cache: true
                  run-install: |
                      args: ["--frozen-lockfile"]

            - name: Check
              run: pnpm run check

            - name: Typecheck
              run: pnpm run typecheck

            - name: Build pages
              run: pnpm run build

            - name: Load Production Secrets
              uses: nlkomaru/secret-manager@v2
              with:
                  project: "nikomaru-vrc"
                  env: "production"
                  aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
                  shared-keys: |
                      CLOUDFLARE_ACCOUNT_ID

            - name: Deploy pages
              id: deploy-pages
              env:
                  CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || env.CLOUDFLARE_API_KEY }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  secrets_file="$(mktemp)"
                  trap 'rm -f "$secrets_file"' EXIT
                  printf 'TABLE_URL=%s\n' "${TABLE_URL}" > "$secrets_file"
                  pnpm exec cf deploy --prebuilt --secrets-file "$secrets_file"
