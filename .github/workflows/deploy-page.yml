name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    timeout-minutes: 10
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

        # Node.jsのインストール
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache-dependency-path: ./pnpm-lock.yaml
          cache: 'pnpm'

      - name: Install
        run: pnpm install

      - name: Build pages
        run: pnpm run build

      - name: Load Production Secrets
        uses: nlkomaru/secret-manager@main
        with:
          project: "nikomaru-vrc"
          env: "production"
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}

      - name: Deploy pages
        id: deploy-pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN || env.CLOUDFLARE_API_KEY }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          # vinext build が生成する設定でデプロイする(ルートの wrangler.jsonc は開発用)
          command: deploy --config dist/server/wrangler.json
